<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multimedia Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Multimedia Hub</h1>

  <section>
    <h2>Now Playing: Sailing Away</h2>
    <audio controls aria-label="Audio player playing Sailing Away song">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </section>

  <section>
    <h2>Video Lesson: JavaScript Map Method</h2>
    <video controls width="600" aria-label="Video tutorial explaining how the JavaScript map method works">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="English">
      Your browser does not support the video element.
    </video>
  </section>

  <section>
    <h2>Transcript</h2>
    <p>In this video, we explore the JavaScript map method, learning how it creates a new array populated with the results of calling a provided function on every element in the calling array.</p>
  </section>
</body>
</html>
