<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Qualification Checker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="calculator-card">
        <header>
            <h1>Loan Eligibility Checker</h1>
            <p>Enter your annual income and credit score to check available loans.</p>
        </header>

        <div class="form-group">
            <label for="incomeInput">Annual Income ($):</label>
            <input type="number" id="incomeInput" placeholder="e.g. 50000" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="scoreInput">Credit Score:</label>
            <input type="number" id="scoreInput" placeholder="e.g. 720" autocomplete="off">
        </div>

        <button id="checkBtn">Check Eligibility</button>

        <div id="resultBox" class="result-box hidden">
            <span class="result-title">Result:</span>
            <p id="resultText"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
