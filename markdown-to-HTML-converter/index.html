<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Markdown to HTML Live Converter</h1>
    </header>

    <div class="container">
        <!-- پنل ورودی مارک‌دان -->
        <div class="pane">
            <div class="pane-header">Markdown Input</div>
            <textarea id="markdown-input" placeholder="Type your markdown here..."></textarea>
        </div>

        <!-- پنل پیش‌نمایش زنده -->
        <div class="pane">
            <div class="pane-header">Live Preview</div>
            <div id="preview" class="output-content"></div>
        </div>
    </div>

    <!-- تگ اسکریپت برای اتصال فایل جاوااسکریپت -->
    <script src="script.js"></script>
</body>
</html>
