<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="blog-post-card">
        <img class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="Cover photo for the blog post">
        <div class="post-content">
            <h2 class="post-title">Mastering Linux & Python</h2>
            <p class="post-excerpt">Discover how combining Linux terminal efficiency and Python backend development can level up your programming journey.</p>
            <a class="read-more" href="#">Read More</a>
        </div>
    </div>

</body>
</html>
