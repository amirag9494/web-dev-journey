<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Manifest Validator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Cargo Manifest Validator</h1>
            <p>Normalize units, validate container properties, and process shipping manifests.</p>
        </header>

        <form id="manifestForm" class="form-section">
            <div class="input-group">
                <label for="containerId">Container ID (Positive Integer)</label>
                <input type="number" id="containerId" placeholder="e.g. 55" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="destination">Destination</label>
                <input type="text" id="destination" placeholder="e.g. Carmel" autocomplete="off">
            </div>

            <div class="row-group">
                <div class="input-group">
                    <label for="weight">Weight</label>
                    <input type="number" id="weight" step="any" placeholder="e.g. 400" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="unit">Unit</label>
                    <select id="unit">
                        <option value="kg">kg</option>
                        <option value="lb">lb</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="hazmat"> Hazmat Material Required
                </label>
            </div>

            <div class="button-row">
                <button type="button" id="sampleValidBtn" class="btn secondary">Load Valid Sample</button>
                <button type="button" id="sampleInvalidBtn" class="btn secondary">Load Invalid Sample</button>
            </div>

            <button type="submit" class="btn primary full-width">Process Manifest 🚀</button>
        </form>

        <div id="resultBox" class="result-box hidden">
            <h3>Processing Results</h3>
            <div id="resultContent" class="result-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
