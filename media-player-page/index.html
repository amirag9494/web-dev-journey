<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coding & Focus Media Player</title>
</head>
<body>

  <h1>My Focus & Coding Media Player</h1>

  <section>
    <h2>Nature Video for Focus & Calm</h2>
    <video controls width="640">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <section>
    <h2>Relaxing Coding Music - Sailing Away</h2>
    <audio controls loop src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3">
      Your browser does not support the audio element.
    </audio>
  </section>

</body>
</html>
